dataset:
  repo_id: repo_act_stage3
  root: Datasets/example/top_long_merged

policy:
  type: act
  device: cuda
  push_to_hub: false

  # Stage 3: Self-value prediction head (Ilia-style)
  use_progress_head: true
  progress_loss_weight: 1.0

  input_features:
    observation.state:
      type: STATE
      shape: [12]
    observation.images.top_rgb:
      type: VISUAL
      shape: [3, 480, 640]
    observation.images.left_rgb:
      type: VISUAL
      shape: [3, 480, 640]
    observation.images.right_rgb:
      type: VISUAL
      shape: [3, 480, 640]

  output_features:
    action:
      type: ACTION
      shape: [12]

output_dir: outputs/train/act_stage3_v3
batch_size: 8
steps: 30000
save_freq: 5000
log_freq: 1000

wandb:
  enable: false
